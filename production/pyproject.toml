[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "labor-cost-model"
version = "0.2.0"
description = "Declarative workforce cost models and reconciled attribution"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<2",
    "pandas>=2.1,<3",
    "shap==0.48.0",
    "pyarrow>=14,<24",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10", "pycodestyle>=2.12,<3", "ruff>=0.11,<1",
    "matplotlib>=3.8,<4", "ipython>=8,<9",
    "nbformat>=5.9,<6", "nbclient==0.10.2", "ipykernel>=6.25,<7",
]
notebook = ["jupyterlab>=4,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["parity: compare with the unchanged PoC notebook"]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "I"]
